[package]
name = "blokee"
version = "0.1.0"
edition = "2024"

[dependencies]
rustc-hash = "2.1.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip", "preserve_order"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false

[profile.bench]
inherits = "release"
debug = true
